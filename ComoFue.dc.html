<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>¿Cómo fue el reto?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes svBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes svIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes svPop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes svDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes svFadeA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes svFadeB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sv-in{animation:svIn .7s cubic-bezier(.2,.8,.2,1) both}
.sv-b{border:0;background:transparent;padding:0;cursor:pointer;font-family:Manrope,sans-serif;color:#111}
.sv-chip{height:28px;padding:0;border:0;border-bottom:1px solid #8A8A86;border-radius:0;background:transparent;font:400 15px Manrope,sans-serif;color:#8A8A86;display:flex;align-items:center;gap:5px;cursor:pointer;transition:color .25s,border-color .25s}
.sv-chip[aria-pressed="true"]{color:#111;border-color:#111;border-bottom-width:1.5px}
.sv-chip i{width:8px;height:8px;border-radius:50%;display:inline-block;box-sizing:border-box}
.sv-row{display:flex;align-items:center;height:29px;font-size:12px;cursor:pointer;border:0;background:transparent;width:100%;padding:0;font-family:Manrope,sans-serif;color:#111;text-align:left;border-radius:8px;transition:background .2s}
.sv-row:hover{background:rgba(0,0,0,.035)}
.sv-f{position:absolute;border:0;border-bottom:1px solid #111;background:transparent;font:400 15px Manrope,sans-serif;color:#111;outline:none;padding:0 0 6px;border-radius:0}
.sv-f::placeholder{color:#8A8A86}
</style>
</helmet>
<div style="position: relative; margin-top: 52px; width: 393px; height: 920px; overflow: hidden; background: #FFFFFF; color: #111111; font-family: Manrope, sans-serif">
<svg width="140" height="20" viewBox="0 0 140 20" style="position: absolute; left: -38px; top: 30.5px" aria-hidden="true"><line x1="60" y1="10" x2="116" y2="10" stroke="#B5B5B1" stroke-width="1"></line><line x1="60" y1="10" x2="116" y2="10" stroke="#111" stroke-width="1"></line><circle cx="60" cy="10" r="3.6" fill="#111"></circle><circle cx="78" cy="10" r="3.6" fill="#111"></circle><circle cx="96.5" cy="10" r="3.6" fill="#111"></circle><circle cx="116" cy="10" r="4.6" fill="#EAFE9F" stroke="#111" stroke-width="1"></circle></svg>
<a href="Home.dc.html" data-tr="back" style="position: absolute; right: 22px; top: 30px; font-size: 13px; color: #111; text-decoration: underline; text-underline-offset: 4px; padding: 4px 0">Saltar</a>
<h1 class="sv-in" style="position: absolute; left: 18px; top: 112px; margin: 0; font-family: Poppins, sans-serif; font-weight: 400; font-size: 40px; line-height: 35px; letter-spacing: -0.08em">¿cómo fue<br>el reto?</h1>
<p style="position: absolute; left: 20px; top: 194px; margin: 0; font-size: 13px; color: #8A8A86">Seleccioná cuántas páginas leíste</p>

<div style="position: absolute; left: {{ glow.x }}; top: {{ glow.y }}; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: radial-gradient(circle, rgba(234,254,159,.95) 0%, rgba(234,254,159,.35) 42%, rgba(234,254,159,0) 70%); pointer-events: none"></div>
<svg width="393" height="620" viewBox="0 0 393 620" style="position: absolute; left: 0; top: 0; pointer-events: none" role="img" aria-label="{{ aria }}">
<circle cx="198.5" cy="401" r="139" fill="none" stroke="#111" stroke-width="1"></circle>
<g stroke="#111" stroke-width="1"><sc-for list="{{ ticks }}" as="t" hint-placeholder-count="12"><line x1="{{ t.x1 }}" y1="{{ t.y1 }}" x2="{{ t.x2 }}" y2="{{ t.y2 }}"></line></sc-for></g>
<g fill="none" stroke="#111" stroke-width="0.6" stroke-dasharray="1.5 3"><circle cx="198.5" cy="401" r="122"></circle><circle cx="198.5" cy="401" r="102"></circle><circle cx="198.5" cy="401" r="82"></circle></g>
<g font-family="Manrope, sans-serif" font-size="11.5" text-anchor="middle"><text x="198.5" y="255">0</text><text x="63" y="336">100</text><text x="87" y="524">75</text><text x="276" y="549">50</text></g>
<sc-for list="{{ others }}" as="o" hint-placeholder-count="30"><circle cx="{{ o.x }}" cy="{{ o.y }}" r="3.6" fill="#CFCFCB"></circle></sc-for>
<line x1="{{ ln.x1 }}" y1="{{ ln.y1 }}" x2="{{ ln.x2 }}" y2="{{ ln.y2 }}" stroke="#111" stroke-width="1.4"></line>
<sc-for list="{{ beads }}" as="b" hint-placeholder-count="5"><circle cx="{{ b.x }}" cy="{{ b.y }}" r="3.8" fill="#111"></circle></sc-for>
<circle cx="{{ knob.x }}" cy="{{ knob.y }}" r="17" fill="#FFFFFF" stroke="#111" stroke-width="1" stroke-dasharray="1.6 1.8"></circle>
<circle cx="{{ knob.x }}" cy="{{ knob.y }}" r="11" fill="#EAFE9F" stroke="#111" stroke-width="1.2"></circle>
<circle cx="198.5" cy="401" r="58" fill="#FFFFFF" stroke="#111" stroke-width="0.8"></circle>
<circle cx="198.5" cy="401" r="52" fill="#111"></circle>
<text x="198.5" y="415" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="400" font-size="40" letter-spacing="-1" fill="#FFFFFF">{{ v }}</text>
<text x="198.5" y="434" text-anchor="middle" font-family="Manrope, sans-serif" font-size="7.5" fill="#EAFE9F">páginas</text>
</svg>
<div style="position: absolute; left: {{ pill.x }}; top: {{ pill.y }}; transform: translate(-50%, 0); height: 22px; padding: 0 12px; border-radius: 11px; background: #EAFE9F; border: 1px solid #111; display: flex; align-items: center; font-weight: 700; font-size: 11.5px; white-space: nowrap; pointer-events: none">{{ v }} páginas</div>
<button type="button" class="sv-b" aria-label="Girá para marcar cuántas páginas leíste" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerCancel="{{ up }}" style="position: absolute; left: 40px; top: 242px; width: 318px; height: 318px; border-radius: 50%; touch-action: none; cursor: grab"></button>

<p style="position: absolute; left: 20px; top: 576px; margin: 0; font-size: 14px">{{ same }} vecinos leyeron lo mismo que vos</p>
<p style="position: absolute; left: 20px; top: 614px; margin: 0; font-size: 15px; color: #8A8A86">dejá un rastro si querés:</p>
<div style="position: absolute; left: 20px; top: 646px; display: flex; gap: 38px">
<sc-for list="{{ chips }}" as="k" hint-placeholder-count="3"><button type="button" class="sv-chip" aria-pressed="{{ k.on }}" data-i="{{ k.i }}" onClick="{{ chip }}" >{{ k.t }}</button></sc-for>
</div>
<input class="sv-f" id="sv-rastro" placeholder="{{ ph }}" value="{{ txt }}" onInput="{{ inp }}" style="left: 20px; top: 700px; width: 326px">
<button type="button" class="sv-b" onClick="{{ fin }}" style="position: absolute; left: 0; top: 784px; width: 393px; font-size: 16px"><span style="border-bottom: 1px solid #111; padding-bottom: 3px">Sumar al mapa y terminar</span></button>
<button type="button" class="sv-b" onClick="{{ solo }}" style="position: absolute; left: 0; top: 824px; width: 393px; font-size: 16px; color: #8A8A86"><span style="border-bottom: 1px solid #8A8A86; padding-bottom: 3px">Solo para mí</span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  state = { v: 30, ch: 1, txt: '' };
  CX = 198.5; CY = 401;
  O = [12, 14, 18, 22, 25, 26, 28, 29, 30, 30, 31, 32, 33, 34, 36, 38, 40, 41, 43, 45, 48, 50, 52, 55, 60, 62, 70];
  pt(r, a) { const t = a * Math.PI / 180; return [this.CX + r * Math.sin(t), this.CY - r * Math.cos(t)]; }
  set(e) {
    const b = e.currentTarget.getBoundingClientRect();
    let a = Math.atan2(e.clientX - (b.left + b.width / 2), -(e.clientY - (b.top + b.height / 2))) * 180 / Math.PI; if (a < 0) a += 360;
    let v = Math.round(a / 3); if (v > 100) v = a > 330 ? 0 : 100;
    if (v !== this.state.v) { this.setState({ v: v }); if (v % 5 === 0) this.props.app && this.props.app.vib(3); }
  }
  down = (e) => { this.on = true; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) {} this.set(e); };
  move = (e) => { if (this.on) this.set(e); };
  up = () => { this.on = false; };
  chip = (e) => { const i = +e.currentTarget.getAttribute('data-i'); this.setState({ ch: this.state.ch === i ? -1 : i }); };
  inp = (e) => this.setState({ txt: e.target.value });
  fin = () => { const a = this.props.app; a.vib([20, 40, 20]); a.toast('listo: tu rastro quedó en el mapa'); a.home(); };
  solo = () => { const a = this.props.app; a.toast('guardado solo para vos'); a.home(); };
  renderVals() {
    const v = this.state.v, A = v * 3, f = (x) => x.toFixed(1);
    const ticks = []; for (let a = 0; a < 360; a += 30) { const p = this.pt(133, a), q = this.pt(139, a); ticks.push({ x1: f(p[0]), y1: f(p[1]), x2: f(q[0]), y2: f(q[1]) }); }
    const kn = this.pt(139, A), l0 = this.pt(58, A), l1 = this.pt(78, A);
    const beads = [0, 1, 2, 3, 4].map((k) => { const p = this.pt(80 + k * 9.5, A); return { x: f(p[0]), y: f(p[1]) }; });
    const others = this.O.map((o, i) => { const p = this.pt(86 + (i * 37 % 34), o * 3 + ((i * 13) % 9 - 4)); return { x: f(p[0]), y: f(p[1]) }; });
    const same = Math.max(1, this.O.filter((o) => Math.abs(o - v) <= 3).length + (v === 30 ? 2 : 0));
    const gp = this.pt(120, A);
    return {
      v: v, ticks: ticks, knob: { x: f(kn[0]), y: f(kn[1]) }, ln: { x1: f(l0[0]), y1: f(l0[1]), x2: f(l1[0]), y2: f(l1[1]) },
      beads: beads, others: others, same: same, pill: { x: f(kn[0]) + 'px', y: f(kn[1] - 46) + 'px' }, glow: { x: f(gp[0]) + 'px', y: f(gp[1]) + 'px' },
      chips: ['una foto', 'una frase', 'un sonido'].map((t, i) => ({ t: t, i: i, on: String(this.state.ch === i) })),
      ph: this.state.ch === 0 ? 'describí la foto…' : this.state.ch === 2 ? 'contá qué sonaba…' : 'escribí lo que quieras', txt: this.state.txt,
      aria: 'Leíste ' + v + ' páginas', down: this.down, move: this.move, up: this.up, chip: this.chip, inp: this.inp, fin: this.fin, solo: this.solo
    };
  }
}
</script>
</body>
</html>
