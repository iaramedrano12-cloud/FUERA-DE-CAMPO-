<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Retos — con destello</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#111}a:hover{color: #8A8A86}
@keyframes fdcBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
@keyframes fdcFlashA{0%{transform:scale(0.15);opacity:1}35%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:0.7}}
@keyframes fdcFlashB{0%{transform:scale(0.15);opacity:1}35%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:0.7}}
@keyframes fdcArcA{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes fdcArcB{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes fdcPopA{0%{transform:scale(0.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fdcPopB{0%{transform:scale(0.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fdcCardA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fdcCardB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; width: 393px; height: 923px; overflow: hidden; background: #FFFFFF; color: #111111; font-family: Manrope, sans-serif">

<a href="back" aria-label="Volver" style="position: absolute; left: 12px; top: 68px; width: 52px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="34" height="14" viewBox="0 0 34 14" aria-hidden="true"><path d="M33 7H2M8 1L2 7l6 6" fill="none" stroke="#111" stroke-width="1.3"></path></svg></a>
<div style="position: absolute; right: 22px; top: 76px; display: flex; align-items: center; gap: 7px; font-size: 13px"><svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6.75" fill="#EAFE9F" stroke="#111" stroke-width=".5"></circle></svg>Retos</div>
<h1 style="position: absolute; left: 18px; top: 124px; margin: 0; font-family: Poppins, sans-serif; font-weight: 400; font-size: 46px; line-height: 50px; letter-spacing: -0.08em">retos</h1>
<a href="Historial.dc.html" style="position: absolute; right: 22px; top: 144px; font-size: 13px; color: #111">ver historial</a>
<p style="position: absolute; left: 22px; top: 186px; margin: 0; font-size: 12px; color: #8A8A86">elegí según el tiempo que tengas</p>

<div style="position: absolute; left: 196.5px; top: 410px; width: 356px; height: 356px; margin: -178px 0 0 -178px; border-radius: 50%; overflow: hidden; pointer-events: none">
<div style="position: absolute; left: {{ glow.x }}; top: {{ glow.y }}; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; background: radial-gradient(circle, #EAFE9F 0%, #EAFE9F 26%, rgba(234, 254, 159, 0) 70%); animation: {{ glow.anim }} 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both"></div>
</div>

<svg width="393" height="620" viewBox="0 0 393 620" style="position: absolute; left: 0; top: 0" role="img" aria-label="Los retos como órbitas alrededor de un centro: cada anillo es cuánto dura el reto, de 5 a 40 minutos. Cada punto es un reto. Al tocarlo, se ilumina con un destello verde y abajo aparece de qué se trata.">
<circle cx="196.5" cy="410" r="178" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="1.6 3.4" stroke-linecap="round"></circle>
<circle cx="196.5" cy="410" r="157" fill="none" stroke="#C9C9C5" stroke-width="1" stroke-dasharray="4 4"></circle>
<circle cx="196.5" cy="410" r="111" fill="none" stroke="#C9C9C5" stroke-width="1" stroke-dasharray="4 4"></circle>
<circle cx="196.5" cy="410" r="65" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="1.6 3.4" stroke-linecap="round"></circle>
<path d="{{ arc.d }}" pathLength="100" fill="none" stroke="#EAFE9F" stroke-width="10" stroke-linecap="round" stroke-dasharray="100 100" style="animation: {{ arc.anim }} 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both"></path>
<g font-family="Manrope, sans-serif" font-weight="700" font-size="11" fill="#111" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
<text x="196.5" y="236">40′</text><text x="196.5" y="257">30′</text><text x="196.5" y="303">15′</text><text x="196.5" y="349">5′</text>
</g>
<circle cx="196.5" cy="410" r="40" fill="#111"></circle>
<text x="196.5" y="418" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="400" font-size="26" letter-spacing="-1.5" fill="#EAFE9F">{{ min }}′</text>
<text x="196.5" y="432" text-anchor="middle" font-family="Manrope, sans-serif" font-size="8.5" fill="#D9D9D6">minutos</text>
</svg>

<sc-for list="{{ retos }}" as="r" hint-placeholder-count="10">
<button type="button" aria-label="{{ r.aria }}" onClick="{{ r.pick }}" style="position: absolute; left: {{ r.l }}; top: {{ r.t }}; width: 44px; height: 44px; border: 0; padding: 0; background: transparent; cursor: pointer">
<span style="position: absolute; left: {{ r.ro }}; top: {{ r.ro }}; width: {{ r.rs }}; height: {{ r.rs }}; box-sizing: border-box; border-radius: 50%; border: 1px dashed #111; background: {{ r.rb }}; animation: {{ r.ranim }}"></span>
<span style="position: absolute; left: 11px; top: 11px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1px solid #111; background: #EAFE9F; opacity: {{ r.fo }}; animation: {{ r.fanim }}"></span>
<span style="position: absolute; left: 17.5px; top: 17.5px; width: 9px; height: 9px; border-radius: 50%; background: #111"></span>
</button>
</sc-for>

<div style="position: absolute; left: 18px; top: 628px; width: 355px; display: flex; align-items: center; justify-content: space-between">
<button type="button" onClick="{{ otros }}" style="height: 36px; border: 0; padding: 0; background: none; display: flex; align-items: center; gap: 8px; font-family: Manrope, sans-serif; font-size: 14px; color: #111; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-2.2-4.6" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"></path><path d="M14.5 2.5v3.6h-3.6" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>otros retos</button>
<span style="font-size: 11px; color: #8A8A86">apretá un punto y mirá el reto</span>
</div>

<sc-for list="{{ card }}" as="c" hint-placeholder-count="1">
<div style="position: absolute; left: 18px; top: 680px; width: 357px; min-height: 170px; box-sizing: border-box; padding: 22px 22px 22px; border: 1px solid #111; border-radius: 24px; background: #FFFFFF; animation: {{ c.anim }} 0.45s ease both">
<div style="font-size: 13px; color: #8A8A86">reto {{ c.zona }} - {{ c.min }} min</div>
<div style="margin-top: 10px; font-family: Poppins, sans-serif; font-weight: 400; font-size: 29px; line-height: 30px; letter-spacing: -0.08em">{{ c.title }}</div>
<div style="margin-top: 6px; font-size: 14px">Lo hicieron {{ c.vec }} vecinos esta semana</div>
<div style="margin-top: 22px; display: flex; gap: 30px; font-size: 15px">
<a href="Guardado.dc.html" data-tr="up" style="color: #111; text-decoration: none; border-bottom: 1px solid #111; padding-bottom: 2px">guardar para hacerlo</a>
<a href="Reto.dc.html" style="color: #111; text-decoration: none; border-bottom: 1px solid #111; padding-bottom: 2px">ver mas</a>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  state = { set: 0, sel: 0, flip: 0 };
  CX = 196.5; CY = 410;
  RAD = { 5: 65, 15: 111, 30: 157, 40: 178 };
  SETS = [
    [
      [40, 62, 'lago', 'leé un libro de romance', 48],
      [40, 300, 'borde', 'caminá el borde entero sin parar', 12],
      [40, 182, 'bulevares', 'dibujá el mapa del parque de memoria', 8],
      [30, 318, 'lago', 'escribí una postal y dejala en un banco', 19],
      [30, 128, 'feria', 'charlá con un puestero sobre su libro favorito', 14],
      [15, 335, 'lago', 'contá los patos del lago', 63],
      [15, 40, 'feria', 'cambiá un libro en la feria', 22],
      [15, 145, 'bulevares', 'saludá a tres personas que no conocés', 15],
      [15, 238, 'anfiteatro', 'mirá las nubes y nombrá una forma', 38],
      [5, 300, 'anfiteatro', 'sentate en la última fila y escuchá', 31],
      [5, 62, 'bulevares', 'contá las tipas de un bulevar', 9],
      [5, 180, 'feria', 'elegí un libro solo por la tapa', 41]
    ],
    [
      [40, 40, 'lago', 'seguí a un pato sin perderlo de vista', 11],
      [40, 220, 'anfiteatro', 'escribí una carta para alguien', 13],
      [30, 300, 'feria', 'leé las dedicatorias de los libros usados', 20],
      [30, 150, 'lago', 'escuchá el agua con los ojos cerrados', 26],
      [15, 20, 'lago', 'buscá el reflejo de un árbol en el agua', 34],
      [15, 110, 'anfiteatro', 'dibujá lo que ves desde arriba', 17],
      [15, 200, 'bulevares', 'abrazá el tronco más grueso que encuentres', 21],
      [15, 280, 'feria', 'preguntá cuál es el libro más viejo del puesto', 16],
      [5, 90, 'lago', 'tirá una piedrita y contá las ondas', 44],
      [5, 270, 'bulevares', 'caminá descalzo diez pasos en el pasto', 29]
    ]
  ];
  pt(r, deg) { const a = deg * Math.PI / 180; return [this.CX + r * Math.sin(a), this.CY - r * Math.cos(a)]; }
  pick = (i) => {
    if (i === this.state.sel) return;
    this.setState({ sel: i, flip: 1 - this.state.flip });
    try { if (navigator.vibrate) navigator.vibrate(6); } catch (err) {}
  };
  otros = () => this.setState({ set: 1 - this.state.set, sel: 0, flip: 1 - this.state.flip });

  renderVals() {
    const st = this.state, L = this.SETS[st.set], c = L[st.sel], k = st.flip ? 'B' : 'A';
    const r = this.RAD[c[0]], a = c[1];
    const p = this.pt(r, a), s = this.pt(r, a - 40), e = this.pt(r, a - 5);
    const f = (q) => q[0].toFixed(1) + ' ' + q[1].toFixed(1);
    const retos = L.map((x, i) => {
      const q = this.pt(this.RAD[x[0]], x[1]), on = i === st.sel;
      return {
        l: (q[0] - 22).toFixed(1) + 'px', t: (q[1] - 22).toFixed(1) + 'px',
        rs: on ? '42px' : '30px', ro: on ? '1px' : '7px', rb: on ? 'transparent' : '#FFFFFF',
        ranim: on ? 'fdcBreathe 3.2s ease-in-out 0.5s infinite' : 'none',
        fo: on ? 1 : 0, fanim: on ? 'fdcPop' + k + ' 0.5s cubic-bezier(0.3, 1.4, 0.5, 1) both' : 'none',
        aria: x[3] + ', ' + x[0] + ' minutos, ' + x[2],
        pick: () => this.pick(i)
      };
    });
    return {
      min: String(c[0]),
      glow: { x: (p[0] - this.CX + 178).toFixed(1) + 'px', y: (p[1] - this.CY + 178).toFixed(1) + 'px', anim: 'fdcFlash' + k },
      arc: { d: 'M' + f(s) + 'A' + r + ' ' + r + ' 0 0 1 ' + f(e), anim: 'fdcArc' + k },
      retos: retos,
      card: [{ zona: c[2], min: String(c[0]), title: c[3], vec: String(c[4]), anim: 'fdcCard' + k }],
      otros: this.otros
    };
  }
}
</script>
</body>
</html>
