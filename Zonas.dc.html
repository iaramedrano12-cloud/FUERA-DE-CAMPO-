<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entrada al parque — zonas tranquilas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#111}a:hover{color: #8A8A86}
@keyframes fdcDrift{from{transform:translate(-1px,-0.6px)}to{transform:translate(1px,0.8px)}}
@keyframes fdcBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; width: 393px; height: 852px; overflow: hidden; background: #FFFFFF; color: #111111; font-family: Manrope, sans-serif">

<div style="position: absolute; left: 22px; top: 44px; font-family: Poppins, sans-serif; font-size: 40px; line-height: 40px">*</div>
<div style="position: absolute; right: 22px; top: 54px; display: flex; align-items: center; gap: 6px; font-size: 12px">
Entrada por Diaz Velez - 17:42</div>

<div style="position: absolute; left: 22px; top: 104px; font-size: 13px; color: #8A8A86">Antes de guardarlo:</div>
<h1 style="position: absolute; left: 20px; top: 124px; width: 340px; margin: 0; font-family: Poppins, sans-serif; font-weight: 400; font-size: 38px; line-height: 35px; letter-spacing: -0.08em">hoy, la calma esta<br>cerca del lago</h1>

<svg width="393" height="560" viewBox="0 0 393 560" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<defs>
<filter id="eb" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
</defs>
<ellipse cx="200" cy="391" rx="182" ry="50" fill="#111" opacity="0.12" filter="url(#eb)"></ellipse>
<g transform="translate(196.5 377) scale(1 0.55) rotate(-25) scale(1.05)">
<path d="M-160 -10C-158 -95 -85 -162 8 -158C100 -154 165 -90 160 2C155 92 92 160 -2 158C-95 156 -162 82 -160 -10Z" fill="#E6E6E3" stroke="#111" stroke-width="1.4" vector-effect="non-scaling-stroke"></path>
</g>
<g transform="translate(196.5 365) scale(1 0.55) rotate(-25) scale(1.05)">
<path d="M-160 -10C-158 -95 -85 -162 8 -158C100 -154 165 -90 160 2C155 92 92 160 -2 158C-95 156 -162 82 -160 -10Z" fill="#FFFFFF" stroke="#111" stroke-width="1.4" vector-effect="non-scaling-stroke"></path>
</g>
</svg>

<img src="img/isla-sonido.svg" alt="" style="position: absolute; left: 0; top: 0; width: 393px; height: 560px">

<svg width="393" height="560" viewBox="0 0 393 560" style="position: absolute; left: 0; top: 0" role="img" aria-label="El parque como una isla en perspectiva. Las líneas son el sonido: más juntas y más oscuras donde hay más ruido, cerca de las avenidas, la feria y los juegos. En verde, las zonas tranquilas alrededor del lago. Tres postes marcan las zonas A, B y C: su altura es cuántos vecinos hay desconectados ahí. Cada puntito es un vecino. Abajo, vos, en la entrada de Díaz Vélez, con el camino hasta la zona elegida.">
<defs>
<pattern id="ew" width="7" height="3.6" patternUnits="userSpaceOnUse"><path d="M0 1.8q1.75 -1.2 3.5 0t3.5 0" fill="none" stroke="#111" stroke-width="0.5"></path></pattern>
</defs>
<g transform="translate(196.5 365) scale(1 0.55) rotate(-25) scale(1.05)">
<path d="M-62 -6C-58 -44 -14 -56 28 -46C68 -36 80 -6 62 20C44 46 -6 50 -34 38C-58 28 -64 12 -62 -6Z" fill="#FFFFFF" stroke="#111" stroke-width="1.1" vector-effect="non-scaling-stroke"></path>
</g>
<g transform="translate(196.5 365) scale(1 0.55) rotate(-25)">
<path d="{{ route }}" pathLength="100" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-dasharray="{{ dash }}" vector-effect="non-scaling-stroke"></path>
</g>
</svg>

<div style="position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none">
<sc-for list="{{ dots }}" as="p" hint-placeholder-count="0">
<span style="position: absolute; left: {{ p.x }}; top: {{ p.y }}; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: {{ p.f }}; transition: background 0.3s ease; animation: fdcDrift {{ p.dur }} ease-in-out {{ p.del }} infinite alternate"></span>
</sc-for>
</div>

<svg width="393" height="560" viewBox="0 0 393 560" style="position: absolute; left: 0; top: 0; pointer-events: none" aria-hidden="true">
<ellipse cx="233.8" cy="309.7" rx="9" ry="3.4" fill="#111" opacity="0.3"></ellipse>
<line x1="233.8" y1="308.7" x2="233.8" y2="263.7" stroke="#111" stroke-width="1.3"></line>
<circle cx="233.8" cy="263.7" r="18" fill="none" stroke="#111" stroke-width="0.9" stroke-dasharray="2.8 2.4" opacity="{{ z0.ro }}" style="transform-box: fill-box; transform-origin: center; animation: fdcBreathe 3.2s ease-in-out infinite"></circle>
<circle cx="233.8" cy="263.7" r="12.5" fill="{{ z0.f }}" stroke="#111" stroke-width="1.3"></circle>
<text x="233.8" y="267.9" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#111">A</text>

<ellipse cx="99.6" cy="388.4" rx="8" ry="3" fill="#111" opacity="0.3"></ellipse>
<line x1="99.6" y1="387.4" x2="99.6" y2="358.4" stroke="#111" stroke-width="1.3"></line>
<circle cx="99.6" cy="358.4" r="18" fill="none" stroke="#111" stroke-width="0.9" stroke-dasharray="2.8 2.4" opacity="{{ z1.ro }}" style="transform-box: fill-box; transform-origin: center; animation: fdcBreathe 3.2s ease-in-out infinite"></circle>
<circle cx="99.6" cy="358.4" r="12.5" fill="{{ z1.f }}" stroke="#111" stroke-width="1.3"></circle>
<text x="99.6" y="362.6" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#111">B</text>

<ellipse cx="228.9" cy="415.9" rx="7" ry="2.6" fill="#111" opacity="0.3"></ellipse>
<line x1="228.9" y1="414.9" x2="228.9" y2="392.9" stroke="#111" stroke-width="1.3"></line>
<circle cx="228.9" cy="392.9" r="18" fill="none" stroke="#111" stroke-width="0.9" stroke-dasharray="2.8 2.4" opacity="{{ z2.ro }}" style="transform-box: fill-box; transform-origin: center; animation: fdcBreathe 3.2s ease-in-out infinite"></circle>
<circle cx="228.9" cy="392.9" r="12.5" fill="{{ z2.f }}" stroke="#111" stroke-width="1.3"></circle>
<text x="228.9" y="397.1" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="12" fill="#111">C</text>

<circle cx="255.4" cy="440.9" r="10" fill="none" stroke="#111" stroke-width="0.9" stroke-dasharray="2.4 2" style="transform-box: fill-box; transform-origin: center; animation: fdcBreathe 3.2s ease-in-out infinite"></circle>
<circle cx="255.4" cy="440.9" r="5.5" fill="#111"></circle>
</svg>

<sc-for list="{{ zones }}" as="z" hint-placeholder-count="3">
<button type="button" aria-label="{{ z.aria }}" onClick="{{ z.pick }}" style="position: absolute; left: {{ z.bx }}; top: {{ z.by }}; width: 44px; height: 44px; border: 0; padding: 0; border-radius: 50%; background: transparent; cursor: pointer"></button>
</sc-for>


<div style="position: absolute; left: 22px; top: 512px; width: 349px; height: 158px; box-sizing: border-box; padding: 18px 20px; border: 1px solid #111; border-radius: 24px; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 30px; height: 30px; border-radius: 50%; background: #111; color: #EAFE9F; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">{{ cur.k }}</span>
<span style="font-family: Poppins, sans-serif; font-weight: 400; font-size: 21px; line-height: 22px; letter-spacing: -0.07em">{{ cur.name }}</span>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 16px">
<div><div style="font-size: 12px; letter-spacing: 0.02em; color: #8A8A86">RUIDO</div><div style="font-family: Poppins, sans-serif; font-weight: 400; font-size: 21px; line-height: 24px; letter-spacing: -0.06em">{{ cur.db }} db</div></div>
<div><div style="font-size: 12px; letter-spacing: 0.02em; color: #8A8A86">GENTE</div><div style="font-family: Poppins, sans-serif; font-weight: 400; font-size: 21px; line-height: 24px; letter-spacing: -0.06em">{{ cur.gente }}</div></div>
<div><div style="font-size: 12px; letter-spacing: 0.02em; color: #8A8A86">FERIA A</div><div style="font-family: Poppins, sans-serif; font-weight: 400; font-size: 21px; line-height: 24px; letter-spacing: -0.06em">{{ cur.dist }}</div></div>
</div>
<div style="margin-top: 16px; font-size: 13px">Aca se desconectan <b>{{ cur.prom }} min</b> en promedio</div>
</div>

<a href="Fuera.dc.html" data-tr="reveal" style="position: absolute; left: 0; width: 393px; top: 700px; text-align: center; font-size: 16px; color: #111; text-decoration: none"><span style="border-bottom: 1px solid #111; padding-bottom: 3px">Desconectarme</span></a>
<a href="Retos.dc.html" style="position: absolute; left: 0; width: 393px; top: 738px; text-align: center; font-size: 16px; color: #8A8A86; text-decoration: none"><span style="border-bottom: 1px solid #8A8A86; padding-bottom: 3px">Elegir un reto</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  state = { sel: 0, prog: 100 };
  Z = [
    { k: 'A', hx: 233.8, hy: 263.7, name: 'entre el lago y el museo', db: 41, vec: 14, dist: '380 m', gente: 'poca', prom: 42, route: 'M-5 150C60 140 118 60 112 0C108 -40 92 -64 77 -77' },
    { k: 'B', hx: 99.6, hy: 358.4, name: 'la orilla oeste del lago', db: 40, vec: 9, dist: '260 m', gente: 'mucha', prom: 35, route: 'M-5 150C-40 132 -95 100 -112 40C-118 16 -110 4 -105 -4' },
    { k: 'C', hx: 228.9, hy: 392.9, name: 'al sur del lago', db: 43, vec: 7, dist: '120 m', gente: 'poca', prom: 28, route: 'M-5 150C-6 135 -8 115 -9 96' }
  ];
  D = {
    A: [[72.9, -63.6], [61.9, -65.7], [54.8, -75.3], [60.7, -48.5], [81.9, -59.0], [74.5, -76.9], [60.1, -82.7], [49.5, -48.5], [73.6, -55.9], [27.4, -49.0], [30.6, -40.9], [84.4, -68.0], [45.5, -68.1], [50.9, -83.7]],
    B: [[-84.6, 9.1], [-93.7, -10.7], [-93.6, -19.1], [-95.4, 16.7], [-88.4, -5.7], [-74.9, 12.5], [-78.2, -18.2], [-75.8, 27.8], [-92.4, 5.2]],
    C: [[-8.6, 88.2], [22.8, 87.7], [-21.4, 67.9], [-1.0, 65.9], [-5.2, 73.1], [-14.2, 81.8], [2.7, 95.0]],
    x: [[96.5, -30.7], [29.0, -97.6], [-23.4, 104.7], [-41.6, -47.9]]
  };
  proj(x, y) {
    x *= 1.07; y *= 1.07;
    const c = 0.9063, s = 0.4226;
    return [196.5 + x * c + y * s, 365 + 0.55 * (-x * s + y * c)];
  }

  pick = (i) => {
    if (i === this.state.sel) return;
    this.setState({ sel: i, prog: 0 });
    try { if (navigator.vibrate) navigator.vibrate(5); } catch (err) {}
    cancelAnimationFrame(this.raf);
    const t0 = performance.now();
    const step = (t) => {
      const q = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - q, 3);
      this.setState({ prog: e * 100 });
      if (q < 1) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  };
  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  renderVals() {
    const s = this.state.sel, cur = this.Z[s];
    const dots = [];
    let n = 0;
    ['A', 'B', 'C', 'x'].forEach((k) => {
      this.D[k].forEach((p) => {
        const q = this.proj(p[0], p[1]);
        dots.push({
          x: q[0].toFixed(1) + 'px', y: q[1].toFixed(1) + 'px',
          f: k === cur.k ? '#111111' : '#9A9A96',
          dur: (2.6 + (n % 5) * 0.5) + 's', del: (-(n % 7) * 0.4) + 's'
        });
        n++;
      });
    });
    const zones = this.Z.map((z, i) => ({
      f: i === s ? '#EAFE9F' : '#FFFFFF',
      ro: i === s ? 1 : 0,
      bx: (z.hx - 22) + 'px', by: (z.hy - 22) + 'px',
      aria: 'Ver la zona ' + z.k + ': ' + z.name,
      pick: () => this.pick(i)
    }));
    return {
      route: cur.route,
      dash: this.state.prog.toFixed(1) + ' 200',
      dots: dots,
      zones: zones,
      z0: zones[0], z1: zones[1], z2: zones[2],
      cur: { k: cur.k, name: cur.name, db: String(cur.db), vec: String(cur.vec), dist: cur.dist, gente: cur.gente, prom: String(cur.prom) }
    };
  }
}
</script>
</body>
</html>
