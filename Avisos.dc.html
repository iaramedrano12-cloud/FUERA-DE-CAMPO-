<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Quién puede interrumpirte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.av-in{animation:avIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes avIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes avPop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes avRing{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-14deg)}85%{transform:rotate(12deg)}92%{transform:rotate(-6deg)}}
.av-row{position:absolute;left:20px;width:353px;height:48px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;font-family:Manrope,sans-serif;color:#111;border-radius:14px;transition:background .25s}
.av-row:active{background:#F5F5F2}
.av-a{border:0;background:transparent;padding:0;cursor:pointer;font-family:Manrope,sans-serif;color:#111}
</style>
</helmet>
<div style="position: relative; width: 393px; height: 852px; overflow: hidden; background: #FFFFFF; color: #111111; font-family: Manrope, sans-serif">
<a href="back" aria-label="Volver" style="position: absolute; left: 14px; top: 74px; width: 50px; height: 40px; display: flex; align-items: center"><svg width="34" height="14" viewBox="0 0 34 14" aria-hidden="true"><path d="M33 7H2M8 1L2 7l6 6" fill="none" stroke="#111" stroke-width="1.3"></path></svg></a>
<div style="position: absolute; right: 22px; top: 86px; font-size: 12px">Paso 2 de 2</div>

<h1 class="av-in" style="position: absolute; left: 63px; top: 156px; margin: 0; font-family: Poppins, sans-serif; font-weight: 400; font-size: 35px; line-height: 33px; letter-spacing: -0.08em">tus<br>notificaciones te<br>esperan afuera</h1>

<div class="av-in" style="position: absolute; left: 62px; top: 308px; animation-delay: .08s">
<div style="display: flex; gap: 10px"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="animation: avRing 3s ease-in-out infinite; transform-origin: 50% 50%"><path d="M4 2l3 3-1.6 2.2a10 10 0 0 0 5.4 5.4L13 11l3 3-2 2C7.8 16 2 10.2 2 4z" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"></path></svg>
<span style="font-size: 12px; line-height: 17px">Las llamadas siempre pasan<br><span style="color: #8A8A86">Para no perderte una urgencia</span></span></div>
<div style="display: flex; gap: 10px; margin-top: 15px"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4.5 12.5V8a4.5 4.5 0 0 1 9 0v4.5l1.5 1.5H3zM7.2 16a2 2 0 0 0 3.6 0" fill="none" stroke="#111" stroke-width="1.2"></path></svg>
<span style="font-size: 12px; line-height: 17px">Modo parque<br><span style="color: #8A8A86">Las notificaciones se silencian<br>al cruzar el parque</span></span></div>
</div>

<div class="av-in" style="position: absolute; left: 64px; top: 462px; font-family: Poppins, sans-serif; font-weight: 400; font-size: 20px; letter-spacing: -0.07em; animation-delay: .14s">¿quién puede interrumpirte?</div>

<sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
<button type="button" class="av-row" role="checkbox" aria-checked="{{ r.on }}" data-i="{{ r.i }}" onClick="{{ toggle }}" style="top: {{ r.y }}">
<span style="width: 40px; height: 40px; margin-left: 47px; border-radius: 50%; background: #EAFE9F; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-size: 18px; animation: {{ r.pop }}">{{ r.l }}</span>
<span style="margin-left: 12px; font-size: 12px; flex: 1; text-align: left">{{ r.n }}</span>
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="margin-right: 36px">
<rect x="1" y="1" width="20" height="20" rx="4" fill="{{ r.bg }}" stroke="#111" style="transition: fill .25s"></rect>
<path d="M6 11.5l3.4 3.4L16 8" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="{{ r.dash }}" style="transition: stroke-dashoffset .35s ease"></path>
</svg>
</button>
</sc-for>

<button type="button" class="av-a" onClick="{{ next }}" style="position: absolute; left: 136px; top: 718px; width: 122px; height: 34px; font-size: 16px"><span style="border-bottom: 1px solid #111; padding-bottom: 3px">Siguiente</span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  state = { on: [true, true, false], last: -1, k: 0 };
  P = [['M', 'Mamá'], ['J', 'Juli'], ['T', 'Trabajo']];
  componentDidMount() { this.setState({ on: this.props.app.S.interrupt.slice() }); }
  toggle = (e) => {
    const i = +e.currentTarget.getAttribute('data-i'), on = this.state.on.slice(); on[i] = !on[i];
    this.props.app.vib(6); this.setState({ on: on, last: i, k: this.state.k + 1 });
    this.props.app.S.interrupt = on; this.props.app.save('interrupt');
  };
  next = () => this.props.app.go('listo', 'fade');
  renderVals() {
    const st = this.state;
    return {
      rows: this.P.map((p, i) => ({ i: i, l: p[0], n: p[1], y: (508 + i * 53) + 'px', on: st.on[i] ? 'true' : 'false',
        bg: st.on[i] ? '#EAFE9F' : '#FFFFFF', dash: st.on[i] ? 0 : 1, pop: st.last === i ? 'avPop .4s ease' + (st.k % 2 ? '' : ' 0s 1 normal') : 'none' })),
      toggle: this.toggle, next: this.next
    };
  }
}
</script>
</body>
</html>
