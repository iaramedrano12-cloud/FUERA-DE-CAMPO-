<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historial de retos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.hl-row{position:relative;display:flex;align-items:center;gap:16px;width:100%;height:88px;box-sizing:border-box;border-top:1px solid #111;text-decoration:none;color:#111;animation:hlIn .55s cubic-bezier(.2,.8,.2,1) both}
.hl-row:active .hl-ar{transform:translateX(6px)}
.hl-ar{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.hl-grp{font-size:14px;color:#8A8A86;margin:0 0 10px;animation:hlIn .55s cubic-bezier(.2,.8,.2,1) both}
.hl-chip{height:22px;padding:0 13px;border-radius:11px;border:1px solid #111;font:400 14px Manrope,sans-serif;cursor:pointer;transition:background .3s,color .3s}
.hl-arc{animation:hlArc .9s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes hlArc{from{stroke-dasharray:0 200}}
@keyframes hlIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; width: 393px; min-height: 852px; height: {{ H }}; overflow: hidden; background: #FFFFFF; color: #111111; font-family: Manrope, sans-serif">

<a href="back" aria-label="Volver" style="position: absolute; left: 12px; top: 68px; width: 52px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="34" height="14" viewBox="0 0 34 14" aria-hidden="true"><path d="M33 7H2M8 1L2 7l6 6" fill="none" stroke="#111" stroke-width="1.3"></path></svg></a>
<div style="position: absolute; right: 22px; top: 76px; display: flex; align-items: center; gap: 7px; font-size: 13px"><svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6.75" fill="#EAFE9F" stroke="#111" stroke-width=".5"></circle></svg>Historial</div>

<h1 style="position: absolute; left: 18px; top: 140px; margin: 0; font-family: Poppins, sans-serif; font-weight: 400; font-size: 44px; line-height: 44px; letter-spacing: -0.08em">tu historial</h1>
<div style="position: absolute; left: 20px; top: 190px; font-size: 14px; color: #8A8A86">{{ summary }}</div>

<div style="position: absolute; left: 18px; top: 222px; display: flex; gap: 11px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
<button type="button" class="hl-chip" aria-pressed="{{ t.on }}" onClick="{{ t.go }}" style="background: {{ t.bg }}; color: {{ t.c }}">{{ t.label }}</button>
</sc-for>
</div>

<div style="position: absolute; left: 0; top: 284px; width: 393px" key="{{ fkey }}">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<div style="padding: 0 0 0 20px; margin-top: {{ g.mt }}"><div class="hl-grp" style="animation-delay: {{ g.d }}">{{ g.name }} - {{ g.count }}</div></div>
<sc-for list="{{ g.items }}" as="r" hint-placeholder-count="3">
<a href="Reto.dc.html" class="hl-row" aria-label="{{ r.aria }}" style="padding: 0 18px 0 20px; animation-delay: {{ r.d }}">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="flex: none">
<circle cx="32" cy="32" r="31" fill="none" stroke="#111" stroke-width="0.9" stroke-dasharray="2.6 2.4"></circle>
<circle cx="32" cy="32" r="22.5" fill="none" stroke="#EDEDE9" stroke-width="7"></circle>
<circle cx="32" cy="32" r="22.5" fill="none" stroke="#EAFE9F" stroke-width="7" stroke-dasharray="{{ r.arc }}" transform="rotate(-90 32 32)" class="hl-arc"></circle>
<circle cx="32" cy="32" r="18" fill="#111"></circle>
<text x="32" y="36" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" letter-spacing="-0.5" fill="#EAFE9F">{{ r.min }}″</text>
</svg>
<div style="flex: 1; min-width: 0">
<div style="font-family: Poppins, sans-serif; font-weight: 400; font-size: 20px; line-height: 22px; letter-spacing: -0.07em">{{ r.title }}</div>
<div style="font-size: 12px; line-height: 16px; color: #8A8A86; margin-top: 2px">{{ r.meta }}</div>
</div>
<svg class="hl-ar" width="32" height="14" viewBox="0 0 32 14" aria-hidden="true" style="flex: none"><path d="M0 7H30M24 1l6 6-6 6" fill="none" stroke="#111" stroke-width="1.3"></path></svg>
</a>
</sc-for>
<div style="border-top: 1px solid #111"></div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
const DATA = [
  { m: 'noviembre', title: 'leé un libro de romance', place: 'lago', min: 40, day: 'jue 19' },
  { m: 'noviembre', title: 'conta los patos del lago', place: 'lago', min: 10, day: 'lun 16' },
  { m: 'noviembre', title: 'elegí un libro por la tapa', place: 'feria', min: 15, day: 'sáb 14' },
  { m: 'noviembre', title: 'escucha el parque', place: 'lago', min: 5, day: 'mié 15' },
  { m: 'noviembre', title: 'dibuja lo que ves', place: 'arboleda', min: 20, day: 'jue 12' },
  { m: 'octubre', title: 'leé un libro de romance', place: 'lago', min: 40, day: 'jue 29' },
  { m: 'octubre', title: 'conta los patos del lago', place: 'lago', min: 10, day: 'lun 26' }
];
const TABS = ['todos', 'lago', 'feria', 'arboleda'];
const C = 2 * Math.PI * 22.5;
class Component extends DCLogic {
  state = { f: 'todos' };
  pick = (k) => { if (k === this.state.f) return; this.setState({ f: k }); try { navigator.vibrate && navigator.vibrate(5); } catch (e) {} };
  renderVals() {
    const f = this.state.f;
    const list = DATA.filter((r) => f === 'todos' || r.place === f);
    const total = list.reduce((s, r) => s + r.min, 0), h = Math.floor(total / 60), mm = total % 60;
    const months = [...new Set(list.map((r) => r.m))];
    let n = 0;
    const groups = months.map((m, gi) => {
      const items = list.filter((r) => r.m === m).map((r) => ({
        title: r.title, min: r.min, meta: r.place + ' · ' + r.day + ' · ' + r.min + ' min',
        arc: (C * Math.min(1, r.min / 40)).toFixed(1) + ' 200', d: (0.05 + 0.06 * n++).toFixed(2) + 's',
        aria: r.title + ', ' + r.place + ', ' + r.day
      }));
      return { name: m, count: items.length + (items.length === 1 ? ' reto' : ' retos'), items, d: (0.03 + 0.06 * gi).toFixed(2) + 's', mt: gi ? '44px' : '0px' };
    });
    const rows = list.length, H = Math.max(852, 284 + rows * 88 + months.length * 34 + (months.length - 1) * 44 + 60);
    return {
      summary: rows + (rows === 1 ? ' reto hecho' : ' retos hechos') + ' - ' + (h ? h + 'h ' : '') + mm + ' min sin pantalla',
      tabs: TABS.map((k) => ({ label: k, on: k === f ? 'true' : 'false', bg: k === f ? '#EAFE9F' : '#111111', c: k === f ? '#111111' : '#FFFFFF', go: () => this.pick(k) })),
      groups, fkey: f, H: H + 'px'
    };
  }
}
</script>
</body>
</html>
