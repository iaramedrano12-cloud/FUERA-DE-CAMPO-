<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  state = { i: 6 };
  V = [4, 7, 11, 14, 12, 9, 13, 19, 26, 34, 29, 17, 8];
  T = [17, 18, 20, 22, 24, 26, 27, 27, 26, 24, 22, 20, 19];
  TREES = [[243.3, 519.3], [119.7, 530.7], [213.3, 539.1], [165.7, 539.8], [313.8, 552.3], [255.4, 554.6], [210.1, 556.4], [156.7, 557.4], [318, 574.2], [281.3, 580.4], [88.3, 588.7], [252.4, 605.5], [303.4, 606.8], [54, 613.2], [93.2, 619.6], [202.5, 624.4], [274.5, 634.9], [237.7, 635.5], [109.1, 639.2], [167.2, 640.1]];
  OPEN = [[118, 606], [286, 628], [72, 640], [337, 596], [187, 668], [60, 596], [228, 672], [150, 662], [300, 540], [132, 548], [262, 668], [330, 630], [46, 570], [245, 655]];
  U = Array.from({ length: 36 }, (_, k) => { const x = Math.sin(k * 12.9898 + 4.1) * 43758.5453; return x - Math.floor(x); });
  W = Array.from({ length: 36 }, (_, k) => { const x = Math.sin(k * 78.233 + 1.3) * 24634.6345; return x - Math.floor(x); });

  pick = (e) => {
    const el = e.currentTarget || e.target;
    const r = el.getBoundingClientRect();
    const x = 30 + (e.clientX - r.left) / r.width * 333;
    const y = 126 + (e.clientY - r.top) / r.height * 190;
    let a = Math.atan2(300 - y, x - 196.5);
    if (a < 0) a = x < 196.5 ? Math.PI : 0;
    const i = Math.max(0, Math.min(12, Math.round((1 - a / Math.PI) * 12)));
    if (i !== this.state.i) {
      this.setState({ i: i });
      try { if (navigator.vibrate) navigator.vibrate(5); } catch (err) {}
    }
  };
  down = (e) => {
    this.dragging = true;
    try { (e.currentTarget || e.target).setPointerCapture(e.pointerId); } catch (err) {}
    this.pick(e);
  };
  move = (e) => { if (this.dragging) this.pick(e); };
  up = () => { this.dragging = false; };

  renderVals() {
    const i = this.state.i, hour = 8 + i, n = this.V[i], T = this.T[i];
    const a = Math.PI * (1 - i / 12);
    const sx = 196.5 + 140 * Math.cos(a), sy = 300 - 140 * Math.sin(a);
    const dx = -36 * Math.cos(a), dy = 3 + 5 * (1 - Math.sin(a));
    const pct = Math.round(20 + (T - 17) * 5.1);
    const diff = Math.max(1, Math.round((T - 17) / 2));
    const nShade = Math.round(n * pct / 100);
    const future = hour > 17;
    const dots = [];
    for (let k = 0; k < 36; k++) {
      const on = k < n, shade = k < nShade;
      let x = 196.5, y = 590;
      if (on && shade) {
        const t = this.TREES[(k * 7) % 20];
        x = t[0] + dx * 0.8 + (this.U[k] - 0.5) * 16;
        y = t[1] + 3 + dy * 0.8 + (this.W[k] - 0.5) * 5;
      } else if (on) {
        const o = this.OPEN[(k - nShade) % this.OPEN.length];
        x = o[0] + (this.U[k] - 0.5) * 8;
        y = o[1] + (this.W[k] - 0.5) * 4;
      }
      dots.push({
        t: 'translate(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px)',
        o: on ? 1 : 0,
        d: (k * 8) + 'ms',
        bg: future ? '#FFFFFF' : shade ? '#111111' : '#EAFE9F',
        bd: future || !shade ? '1px solid #111111' : '0 solid #111111',
        dur: (2.6 + (k % 5) * 0.5) + 's',
        del: (-(k % 7) * 0.4) + 's'
      });
    }
    return {
      sun: { x: sx.toFixed(1), y: sy.toFixed(1), ty: (sy - 24).toFixed(1) },
      cone: sx.toFixed(1) + ',' + (sy + 10).toFixed(1) + ' 105,528 288,528',
      sh: { x: dx.toFixed(1), y: dy.toFixed(1), hx: (dx / 2).toFixed(1), hy: (dy / 2).toFixed(1) },
      time: hour + ':00',
      tsun: T + '°',
      tsombra: (T - diff) + '°',
      pct: String(pct),
      verbo: future ? 'elegiría' : 'eligió',
      vecinos: String(n),
      dots: dots,
      down: this.down, move: this.move, up: this.up
    };
  }
}
</script>
