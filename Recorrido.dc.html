<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  state = { sh: false, t: 70 };
  SEG = [
    [[-5, 150], [0, 125], [8, 110], [10, 95]],
    [[10, 95], [-20, 70], [-100, 50], [-110, -10]],
    [[-110, -10], [-115, -60], [-60, -95], [0, -95]],
    [[0, -95], [50, -95], [95, -75], [100, -40]],
    [[100, -40], [102, -20], [130, -12], [155, -10]]

  H = [12, 5, 4, 6, 4, 3, 5, 4, 3, 4, 5, 4, 14, 3, 2, 3, 2, 2, 3, 2, 2, 3, 2, 3, 2, 2, 3, 2, 3, 2, 2, 3, 13, 6, 8, 7, 9, 6, 7, 8];

  bez(s, u) {
    const a = 1 - u;
    const k0 = a * a * a, k1 = 3 * a * a * u, k2 = 3 * a * u * u, k3 = u * u * u;

  }
  segLen(s, u) {
    let len = 0, p = s[0];
    for (let i = 1; i <= 24; i++) {
      const q = this.bez(s, u * i / 24);
      len += Math.hypot(q[0] - p[0], q[1] - p[1]);
      p = q;
    }
    return len;
  }
  loc(t) {
    if (t <= 7) return { s: 0, u: Math.max(0, (t - 5) / 2), lab: 'entrando por Díaz Vélez', near: 8, stop: 0 };
    if (t <= 37) return { s: 0, u: 1, lab: 'parada 1', near: 5, stop: 1 };
    if (t <= 40) return { s: 1, u: (t - 37) / 3, lab: 'caminando', near: 6, stop: 0 };
    if (t <= 90) return { s: 1, u: 1, lab: 'parada 2', near: 3, stop: 2 };
    if (t <= 91) return { s: 2, u: t - 90, lab: 'caminando', near: 6, stop: 0 };

  componentWillUnmount() { this.playing = false; cancelAnimationFrame(this.raf); }

  pick = (e) => {
    const el = e.currentTarget || e.target;
    const r = el.getBoundingClientRect();
    const t = Math.max(5, Math.min(113, (e.clientX - r.left) / r.width * 120));

  down = (e) => {

  };

  sheetT = () => { if (this.sw) { this.sw = false; return; } this.setState({ sh: !this.state.sh }); try { navigator.vibrate && navigator.vibrate(6); } catch (e) {} };

  MOMS = [['16:05', 'entraste por Díaz Vélez', '', 5], ['16:10', 'caminaste por los bulevares', '30 min', 20], ['16:40', 'te quedaste en la orilla del lago', '50 min', 60], ['17:05', 'un momento con el celular', '2 min', 91], ['17:30', 'pasaste por la feria', '20 min', 100], ['17:55', 'saliste · te sentiste "tranquila"', '', 113]];

  renderVals() {

        o: on ? 1 : 0,

    const row = t < 40 ? 0 : t < 112 ? 1 : 2;
    const __sh = { sheetTop: this.state.sh ? '163px' : '590px', sheetLabel: this.state.sh ? 'Bajar la hoja' : 'Subir la hoja', sheetT: this.sheetT, sheetD: this.sheetD, sheetU: this.sheetU };
    return { ...__sh, pills: [['1 · 30′', 40, 82, 1], ['2 · 50′', 136, 145, 2], ['3 · 20′', 287, 58, 3]].map((q) => ({ t: q[0], t2: [0, 20, 60, 100][q[3]], x: q[1] + 'px', w: q[2] + 'px', bg: L.stop === q[3] ? '#EAFE9F' : (L.stop ? '#111111' : (q[3] === 2 ? '#EAFE9F' : '#111111')), c: (L.stop === q[3] || (!L.stop && q[3] === 2)) ? '#111111' : '#FFFFFF' })),
      snd: (() => { let d = 'M25 70'; this.H.forEach((h, i) => { d += 'L' + (25 + i / 39 * 348).toFixed(1) + ' ' + (70 - h * 1.9).toFixed(1); }); return d + 'L373 70Z'; })(),
      moms: this.MOMS.map((r, i) => { const nx = this.MOMS[i + 1] ? this.MOMS[i + 1][3] : 999; const on = t >= r[3] - 3 && t < nx - 3; return { h: r[0], s: r[1], m: r[2], t: r[3], y: (306 + i * 28.5) + 'px', bg: on ? '#EAFE9F' : '#F3F3F1' }; }),
      nums: [['3', 'paradas', 26], ['2,1k', 'caminados', 148], ['12', 'vecinos con un camino parecido', 271]].map((n) => ({ n: n[0], l: n[1], x: n[2] + 'px' })), goT: this.goT, stopBtns: [[245.7, 360, 20, "Parada 1"], [92.6, 318, 60, "Parada 2"], [270.2, 289, 100, "Parada 3"]].map((b) => ({ x: (b[0] - 20) + 'px', y: (b[1] - 20) + 'px', t: b[2], l: b[3] })),
