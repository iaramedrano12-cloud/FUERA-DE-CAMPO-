<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes meRow{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes meLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes meX{from{transform:rotate(-135deg) scale(.6)}to{transform:none}}
@keyframes meSpin{to{transform:rotate(360deg)}}
@keyframes meFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.me-row{position:absolute;left:0;width:393px;height:101px;text-decoration:none;color:#111;display:block;overflow:hidden}
.me-row .bg{position:absolute;inset:0;background:#EAFE9F;opacity:0}
.me-row:active .bg{opacity:.5}
.me-row .t{position:absolute;left:44px;top:12px;font-family:Poppins,sans-serif;font-weight:400;font-size:50px;line-height:64px;letter-spacing:-.08em;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.me-row:hover .t{transform:translateX(6px)}
.me-row .n{position:absolute;left:14px;top:32px;font-family:Poppins,sans-serif;font-size:11px;transform:rotate(-90deg)}
.me-row .s{position:absolute;left:45px;top:72px;font-size:12.5px;color: #8A8A86}
.me-line{position:absolute;left:0;width:393px;height:.5px;background:#111;transform-origin:left;animation:meLine .7s cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>
<div style="position: relative; width: 393px; height: 852px; overflow: hidden; background: #FFFFFF; color: #111111; font-family: Manrope, sans-serif">
<a href="Perfil.dc.html" aria-label="Tu perfil" style="position: absolute; left: 14px; top: 56px; width: 46px; height: 46px; text-decoration: none; color: #111; font-family: Poppins, sans-serif; font-size: 48px; line-height: 64px; text-align: center">*</a>
<div style="position: absolute; left: 234px; top: 74px; display: flex; align-items: center; gap: 7px; font-size: 13px"><svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="6.75" fill="#EAFE9F" stroke="#111" stroke-width=".5"></circle></svg>Afuera del parque</div>

<sc-for list="{{ lines }}" as="l" hint-placeholder-count="5"><div class="me-line" style="top: {{ l.y }}; animation-delay: {{ l.d }}"></div></sc-for>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
<a class="me-row" href="{{ r.href }}" style="top: {{ r.y }}; animation: meRow .6s cubic-bezier(.2,.8,.2,1) {{ r.d }} both">
<span class="bg"></span>
<span class="n">{{ r.n }}</span>
<span class="t">{{ r.t }}</span>
<span class="s">{{ r.s }}</span>
</a>
</sc-for>

<a href="back" data-tr="down" aria-label="Cerrar el menú" style="position: absolute; left: 155px; top: 744px; width: 68px; height: 68px; display: block">
<svg width="68" height="68" viewBox="0 0 68 68" aria-hidden="true" style="overflow: visible">
<circle cx="34.3" cy="34" r="33" fill="none" stroke="#111" stroke-dasharray="3 3" style="transform-origin: 34.3px 34px; animation: meSpin 18s linear infinite"></circle>
<circle cx="34.3" cy="34" r="26.9" fill="#EAFE9F"></circle>
<circle cx="34.2" cy="34.2" r="14.9" fill="#111"></circle>
<g style="transform-origin: 34.2px 34.2px; animation: meX .5s cubic-bezier(.2,.8,.2,1) both"><path d="M30.3 30.3l7.8 7.8M38.1 30.3l-7.8 7.8" stroke="#fff" stroke-width="1.3"></path></g>
</svg>
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  state = {};
  R = [['01', 'mapa', 'donde se desconecta la gente hoy', 'Mapa.dc.html'], ['02', 'retos', 'descubrí maneras de desconectar', 'Retos.dc.html'], ['03', 'desconexiones', 'tus últimas visitas', 'Desconexiones.dc.html'], ['04', 'historia', 'un poco del parque', 'Historia.dc.html']];
  renderVals() {
    return {
      lines: [291.75, 393.25, 495.25, 597.25, 698.25].map((y, i) => ({ y: y + 'px', d: (0.05 + i * 0.06) + 's' })),
      rows: this.R.map((r, i) => ({ n: r[0], t: r[1], s: r[2], href: r[3], y: (292 + i * 101.8) + 'px', d: (0.12 + i * 0.07) + 's' }))
    };
  }
}
</script>
</body>
</html>
