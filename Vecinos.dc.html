  };

  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  sheetT = () => { if (this.sw) { this.sw = false; return; } this.setState({ sh: !this.state.sh }); try { navigator.vibrate && navigator.vibrate(6); } catch (e) {} };
  sheetD = (e) => { this.sy = e.clientY; };
  sheetU = (e) => { if (this.sy == null) return; const dy = e.clientY - this.sy; this.sy = null; if (Math.abs(dy) > 25) { this.sw = true; this.setState({ sh: dy < 0 }); } };
  DOORS = [['48', 'díaz vélez', ''], ['31', 'ángel', 'gallardo'], ['24', 'patricias', 'argentinas'], ['17', 'leopoldo', 'marechal']];
  pickDoor = (e) => { const i = +e.currentTarget.getAttribute('data-i'); this.setState({ door: this.state.door === i ? -1 : i }); try { navigator.vibrate && navigator.vibrate(5); } catch (er) {} };
  renderVals() {
    const st = this.state, v = st.vec, f = this.FEAT[v < 0 ? 0 : v];
    const walkers = [];
    for (let k = 0; k < 24; k++) {
      const d = k < 12 ? this.FEAT[k].d : this.WALK[k - 12][0];
      const L = k < 12 ? this.FEAT[k].L : this.WALK[k - 12][1];
      const dur = Math.round(L / 13 + 6), on = k === v;
      walkers.push({
        p: "path('" + d + "')",
        dur: dur + 's',
        del: '-' + ((k * 7.3) % dur).toFixed(1) + 's',
        s: on ? '11px' : '5px',
        bg: on ? '#EAFE9F' : '#111111',
        bd: on ? '1.4px solid #111111' : '0 solid #111111'
      });
    }
    const rows = this.COR.map((c, i) => ({
      name: c[0], p: parseInt(c[2]), w: c[1], y: (162 + i * 36) + 'px',
      bg: st.cor === i ? '#EAFE9F' : '#F3F3F1',
      pick: () => this.setCor(i)
    }));
    const quiet = v < 0 && st.cor < 0;
    const __sh = { sheetTop: this.state.sh ? "163px" : "590px", sheetLabel: this.state.sh ? 'Bajar la hoja' : 'Subir la hoja', sheetT: this.sheetT, sheetD: this.sheetD, sheetU: this.sheetU };
    return { ...__sh, doors: this.DOORS.map((d, i) => ({ i: i, n: d[0], l: d[1], l2: d[2], x: (i % 2 ? 205 : 20) + 'px', y: (i < 2 ? 394 : 497) + 'px', w: (i % 2 ? 163 : 167) + 'px', bg: this.state.door === i ? '#EAFE9F' : '#FFFFFF' })), pickDoor: this.pickDoor,
      cor: { d: this.COR[st.cor < 0 ? 0 : st.cor][3], o: st.cor < 0 ? 0 : 1 },
      me: { o: quiet ? 1 : 0, w: quiet ? 2.4 : 1.2 },
      sel: { d: f.d, dash: (f.L * st.prog).toFixed(1) + ' 3000', o: v < 0 ? 0 : 1 },
      walkers: walkers,
      rows: rows,
      stepFs: v < 0 ? '19px' : '13.5px', stepTxt: v < 0 ? 'recorre todos los caminos' : 'vecino ' + f.n + ' de 120 · ' + f.m + '′ · ' + this.GS[f.g],
      prev: this.prev, next: this.next, todos: this.todos
    };
  }
}
</script>
